[project]
name = "cis-mcp-probe"
version = "0.1.0"
description = "A black-box validation tool for the CIS MCP Security Benchmark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tal Skverer", email = "tal.skverer@astrix-security.com" }
]
requires-python = ">=3.12"
dependencies = [
    # The public CA set, imported directly: check 2.2 verifies against it alone to
    # tell a server's certificate from a TLS-inspecting proxy's.
    "certifi",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    # Verify against the operating system's trust store, so a host behind a
    # TLS-inspecting proxy is reachable without hand-assembling a CA bundle.
    "truststore>=0.10",
]

[project.scripts]
cis-mcp-probe = "cis_mcp_probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
